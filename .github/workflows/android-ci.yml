name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    # 외부(fork) PR은 Repository Secret을 읽을 수 없어 google-services.json을 만들 수 없으므로 실행하지 않음
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create google-services.json
        shell: bash
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }} # Repository Secret을 읽어옴

      # --- Push(main 브랜치)일 때만 서명 키 등 릴리즈 시크릿을 사용 (PR에는 노출하지 않음) ---
      - name: Setup Release Files (Keystore, Properties)
        if: github.event_name == 'push'
        shell: bash
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ADMOB_API_KEY: ${{ secrets.ADMOB_API_KEY }}
        run: |
          # 1. Keystore 파일 생성
          printf '%s' "$STORE_FILE" | base64 --decode > "$GITHUB_WORKSPACE/pwfb-keystore.jks"

          # 2. local.properties 생성
          # (storeFile에 방금 위에서 생성한 파일의 '정확한 경로'를 지정)
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "storeFile=$GITHUB_WORKSPACE/pwfb-keystore.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
            echo "AdMobAPI_KEY=$ADMOB_API_KEY"
          } > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 테스트
      - name: Test & Lint
        run: ./gradlew lint testDebugUnitTest

      # Push일 때 디버그 빌드 실행
      - name: Assemble Debug (Test)
        if: github.event_name == 'push'
        run: ./gradlew assembleDebug

      # Push일 때만 디버그 이름 변경
      - name: Rename Debug APK to pwfb.apk
        if: github.event_name == 'push'
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/pwfb_debug.apk

      # Push일 때 디버그 apk 업로드
      - name: Upload Debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pwfb_debug
          path: app/build/outputs/apk/debug/pwfb_debug.apk
          retention-days: 7

      # Push일 때만 릴리즈 빌드 실행
      - name: Assemble Release
        if: github.event_name == 'push'
        run: ./gradlew assembleRelease

      # Push일 때 릴리즈 이름 변경
      - name: Rename Release APK to pwfb.apk
        if: github.event_name == 'push'
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/pwfb_release.apk

      # Push일 때만 릴리즈 업로드
      - name: Upload Release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pwfb_release
          path: app/build/outputs/apk/release/pwfb_release.apk
          retention-days: 7
